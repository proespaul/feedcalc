<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipts has moved</title>
<meta http-equiv="refresh" content="0; url=https://proespaul.github.io/receipts/">
<style>body{font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f6f4ef;color:#1b1f1d;margin:0;padding:40px 24px;text-align:center}a{color:#1f6f4a;font-weight:600}</style>
</head>
<body>
<p>The Receipts app has moved to <a href="https://proespaul.github.io/receipts/">proespaul.github.io/receipts/</a>. Taking you there…</p>
<script>
// Let go of the old service worker and cache so this address stays a plain redirect
if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { if (k.indexOf('household-receipts-') === 0) caches.delete(k); }); });
location.replace('https://proespaul.github.io/receipts/');
</script>
</body>
</html>
